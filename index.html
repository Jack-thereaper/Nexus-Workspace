<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Workspace</title>
  <meta name="description" content="Nexus Workspace: a student engineering workspace for tasks, notes, focus, goals and more.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307090f'/%3E%3Ctext x='32' y='43' font-size='34' font-family='Arial' font-weight='700' text-anchor='middle' fill='%234f8cff'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="brand">NEXUS<span>.</span> <small>Workspace</small></div>
    <nav id="nav" aria-label="Sections"></nav>
    <button class="side-foot" id="sideCard" type="button" aria-label="Account options">
      <div class="avatar" id="avatar" aria-hidden="true">N</div>
      <div><strong id="sideName">Guest</strong><small id="sideCourse">Click to set your name</small></div>
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle menu">&#9776;</button>
      <span class="top-title">Nexus Workspace</span>
    </header>
    <div class="warn" id="storageWarn" hidden>Your browser is blocking storage, so nothing you enter will be saved after you close this tab.</div>
    <main id="view" tabindex="-1"></main>
  </div>

  <!-- Login screen. Hidden unless nobody is signed in on this tab. -->
  <div class="login" id="login" hidden>
    <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div class="brand" style="padding:0 0 10px">NEXUS<span>.</span></div>
      <h1 id="loginTitle">Who's using Nexus?</h1>
      <div id="loginBody"></div>
    </div>
  </div>

  <!-- Modal root. Hidden until a form or confirm opens it. -->
  <div class="modal-backdrop" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/academics.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
